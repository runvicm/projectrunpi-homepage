<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 80" width="280" height="80">
  <defs>
    <linearGradient id="gIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2a20"/>
      <stop offset="100%" stop-color="#0a1210"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe87a"/>
      <stop offset="100%" stop-color="#c8860a"/>
    </linearGradient>
  </defs>

  <!-- Icon octagon -->
  <polygon points="40,4 56,8 68,20 72,40 68,60 54,72 26,72 12,60 8,40 12,20 24,8" fill="url(#gIcon)" stroke="#ffe87a" stroke-width="1.5"/>
  <polygon points="40,7 54,11 64,22 68,40 64,58 52,68 28,68 16,58 12,40 16,22 26,11" fill="none" stroke="#c8860a" stroke-width="0.5"/>

  <!-- Speed lines -->
  <line x1="40" y1="40" x2="40" y2="4" stroke="#ffe87a" stroke-width="0.4" opacity="0.25"/>
  <line x1="40" y1="40" x2="71" y2="22" stroke="#ffe87a" stroke-width="0.4" opacity="0.25"/>
  <line x1="40" y1="40" x2="71" y2="58" stroke="#ffe87a" stroke-width="0.4" opacity="0.25"/>
  <line x1="40" y1="40" x2="40" y2="76" stroke="#ffe87a" stroke-width="0.4" opacity="0.25"/>
  <line x1="40" y1="40" x2="9" y2="58" stroke="#ffe87a" stroke-width="0.4" opacity="0.25"/>
  <line x1="40" y1="40" x2="9" y2="22" stroke="#ffe87a" stroke-width="0.4" opacity="0.25"/>

  <!-- Kanji -->
  <text x="40" y="36" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="url(#gGold)" stroke="#0a1210" stroke-width="2.5" paint-order="stroke">縁</text>
  <text x="27" y="57" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#7fffd4" stroke="#0a1210" stroke-width="2.5" paint-order="stroke">和</text>
  <text x="53" y="57" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#ff9de2" stroke="#0a1210" stroke-width="2.5" paint-order="stroke">光</text>

  <!-- Sparkles -->
  <polygon points="40,5 41,8 40,11 39,8" fill="#ffe87a" opacity="0.9"/>
  <polygon points="69,21 70,24 69,27 68,24" fill="#7fffd4" opacity="0.8"/>
  <polygon points="11,21 12,24 11,27 10,24" fill="#ff9de2" opacity="0.8"/>

  <!-- Wordmark -->
  <text x="100" y="50" text-anchor="start" font-family="Georgia,serif" font-size="38" font-weight="700" fill="url(#gGold)" stroke="#0a1210" stroke-width="3" paint-order="stroke">EnWaKou</text>

  <!-- Colour underlines per syllable -->
  <rect x="100" y="56" width="46" height="2.5" rx="1.2" fill="#ffe87a" opacity="0.85"/>
  <rect x="150" y="56" width="46" height="2.5" rx="1.2" fill="#7fffd4" opacity="0.85"/>
  <rect x="200" y="56" width="54" height="2.5" rx="1.2" fill="#ff9de2" opacity="0.85"/>

  <!-- Tagline -->
  <text x="101" y="70" text-anchor="start" font-family="Arial,sans-serif" font-size="9" fill="#7fffd4" opacity="0.6" letter-spacing="2">縁 · 和 · 光  ·  SOCIAL RPG</text>
</svg>