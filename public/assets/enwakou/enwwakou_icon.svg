<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2a20"/>
      <stop offset="100%" stop-color="#0a1210"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe87a"/>
      <stop offset="100%" stop-color="#c8860a"/>
    </linearGradient>
  </defs>

  <!-- Octagon badge -->
  <polygon points="50,4 70,10 86,26 92,50 86,74 70,90 30,90 14,74 8,50 14,26 30,10" fill="url(#gIcon)" stroke="#ffe87a" stroke-width="2"/>
  <polygon points="50,8 68,13 82,28 88,50 82,72 66,86 34,86 18,72 12,50 18,28 32,13" fill="none" stroke="#c8860a" stroke-width="0.8"/>

  <!-- Speed lines -->
  <line x1="50" y1="50" x2="50" y2="4" stroke="#ffe87a" stroke-width="0.5" opacity="0.25"/>
  <line x1="50" y1="50" x2="90" y2="28" stroke="#ffe87a" stroke-width="0.5" opacity="0.25"/>
  <line x1="50" y1="50" x2="90" y2="72" stroke="#ffe87a" stroke-width="0.5" opacity="0.25"/>
  <line x1="50" y1="50" x2="50" y2="96" stroke="#ffe87a" stroke-width="0.5" opacity="0.25"/>
  <line x1="50" y1="50" x2="10" y2="72" stroke="#ffe87a" stroke-width="0.5" opacity="0.25"/>
  <line x1="50" y1="50" x2="10" y2="28" stroke="#ffe87a" stroke-width="0.5" opacity="0.25"/>

  <!-- Kanji triangle -->
  <text x="50" y="44" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="url(#gGold)" stroke="#0a1210" stroke-width="3" paint-order="stroke">縁</text>
  <text x="32" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#7fffd4" stroke="#0a1210" stroke-width="3" paint-order="stroke">和</text>
  <text x="68" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#ff9de2" stroke="#0a1210" stroke-width="3" paint-order="stroke">光</text>

  <!-- Sparkle diamonds -->
  <polygon points="50,5 51.5,9 50,13 48.5,9" fill="#ffe87a" opacity="0.9"/>
  <polygon points="87,27 88.5,31 87,35 85.5,31" fill="#7fffd4" opacity="0.8"/>
  <polygon points="13,27 14.5,31 13,35 11.5,31" fill="#ff9de2" opacity="0.8"/>
</svg>
